<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | CLE TechFest</title>
  <link rel="stylesheet" href="styles.css?v=5">
  <script src="app.js?v=4" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell navbar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">TF</span> CLE TechFest</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="attendees.html">Attendees</a>
      <a href="registration.html">Registration</a>
      <a href="admin.html" aria-current="page">Admin</a>
    </nav>
  </div></header>
  <main class="shell" id="main-content">
    <div class="page-intro"><h1>Admin</h1><p>Manage festival venues and events.</p></div>
    <section class="panel festival-panel"><h2>Current festival</h2><p id="festival-summary"></p></section><div class="grid"><section class="panel"><h2>Venues</h2>
        <form id="venue-form"><label>Name<input name="name"  required></label><label>Capacity<input name="capacity" type="number" min="1" step="1" required></label><div class="actions"><button>Save venue</button><button type="button" class="secondary" data-reset>Clear</button></div><p class="feedback" role="status"></p></form>
        <div id="venue-list" class="record-list"></div></section>
      <section class="panel"><h2>Events</h2>
        <form id="event-form"><label>Title<input name="title"  required></label><label>Venue<select name="venue_id" required></select></label><label>Starts<input name="starts_at" type="datetime-local" required></label><label>Ends<input name="ends_at" type="datetime-local" required></label><label>Capacity<input name="capacity" type="number" min="1" step="1" required></label><label>Description<textarea name="description" rows="2" required></textarea></label><div class="actions"><button>Save event</button><button type="button" class="secondary" data-reset>Clear</button></div><p class="feedback" role="status"></p></form>
        <div id="admin-event-list" class="record-list"></div></section></div>
  </main>
  <footer class="site-footer"><div class="shell"><strong>CLE TechFest</strong><span>Sprint 5 preview · Use fictional information only.</span></div></footer>
</body>
</html>
